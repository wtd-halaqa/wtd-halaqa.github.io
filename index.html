<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحضير وتد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#383735">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تحضير وتد">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* VOICE: لوحة تحضير عملية ودودة لحلقة شبابية، سريعة في اليد
   IDEA: كشف الحضور الورقي للمعلّم، بأزرار ملوّنة بدل العلامات
   PICTURE: قائمة الطلاب نفسها بأزرار الحالة، في أعلى الصفحة
   COLOUR and TYPE: ألوان شعار وتد: فحمي، برتقالي، أصفر، فيروزي؛ Lalezar للعناوين وIBM Plex Arabic للنص
   LAYOUT: شريط علوي فحمي، أسابيع ثم جلسات ثم الدفعات؛ عمود واحد على الجوال */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#1c1b1a);--ink:light-dark(#2a2927,#f1efe9);--mut:light-dark(#6f6b66,#aaa59d);
--line:light-dark(#e8e5e0,#363431);--card:light-dark(#f5f4f1,#262523);--dk:#383735;
--sel:light-dark(#383735,#FCBE14);--selink:light-dark(#ffffff,#2a2927);
--or:#F6941F;--ye:#FCBE14;--te:#2FBFCB;--rd:#E04F3F;--gr:#8a8580}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.top{background:var(--dk);color:#fff;padding:10px max(4vw,14px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font:30px/1 Lalezar,"IBM Plex Sans Arabic",sans-serif;color:#fff}
.brand img{height:48px;width:auto}
nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto}
nav a{color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
nav a.on{background:var(--ye);color:var(--dk)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--te);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px) 70px}
h1,h2{font-family:Lalezar,"IBM Plex Sans Arabic",sans-serif;font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(30px,5vw,44px)}h2{font-size:26px;margin:28px 0 10px}
.mut{color:var(--mut);font-size:14px}
.note{background:var(--card);border-inline-start:4px solid var(--ye);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:15px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.chip{flex:none;scroll-snap-align:start;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:7px 14px;min-height:44px;cursor:pointer;text-align:start;line-height:1.3}
.chip small{display:block;color:var(--mut);font-size:13px}
.chip.on{background:var(--sel);border-color:var(--sel);color:var(--selink)}.chip.on small{color:inherit;opacity:.8}
.chip.add{border-style:dashed;font-weight:700}
.sess{min-width:150px}
.bar{height:5px;background:var(--line);border-radius:5px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--te)}
.chip.on .bar{background:rgba(255,255,255,.25)}
.lbl{font-weight:700;margin:16px 0 4px;font-size:15px}
.panel{background:var(--card);border-radius:16px;padding:16px;margin-top:14px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.phead h1{font-size:clamp(26px,4vw,36px)}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:500;background:var(--bg);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.grp{margin-top:22px}
.grp h3{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:19px;margin:0 0 4px;padding:6px 0;border-bottom:2px solid var(--ink)}
.grp h3 .sp{flex:1}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.nm{font-weight:500;font-size:17px;display:flex;gap:8px;align-items:center}
.pts{font-size:13px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--card);white-space:nowrap}
.pts.neg{color:var(--rd)}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:min(480px,100%)}
.seg button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:500;font-size:14px;cursor:pointer;padding:2px}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
.seg button.on.e{color:#2a2927}
.btn{min-height:44px;border-radius:10px;border:0;background:var(--sel);color:var(--selink);font-weight:700;padding:8px 16px;cursor:pointer;white-space:nowrap}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.s{min-height:36px;padding:4px 12px;font-size:14px}
.btn.dg{background:transparent;color:var(--rd);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.days{display:flex;flex-wrap:wrap;gap:4px}
.days button{min-height:40px;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.days button.on{background:var(--te);border-color:var(--te);color:#fff}
.prow{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
input[type=text],input[type=number],input[type=date],select,textarea{min-height:44px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;width:100%}
textarea{min-height:120px}
.form{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:8px;align-items:center}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ptsg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ptsg label{display:grid;gap:4px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--card);border-radius:14px;padding:14px}
.kpi b{display:block;font:clamp(30px,4vw,40px)/1.1 Lalezar,sans-serif;font-weight:400}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:start;white-space:normal}
td.big{font-weight:700}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 56px;gap:10px;align-items:center;padding:5px 0}
.hb .tr{height:22px;background:var(--card);border-radius:6px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--c,var(--te));border-radius:6px}
.hb span:last-child{text-align:end;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--bg);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.dlg img{width:100%;border-radius:8px;border:1px solid var(--line);margin:10px 0}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.ro .seg button,.ro .edit{pointer-events:none;opacity:.7}
@media(max-width:640px){.row{grid-template-columns:1fr;gap:6px}.seg{width:100%}.form,.srow{grid-template-columns:1fr 1fr}.form button,.srow button{grid-column:span 2}.srow input{grid-column:span 2}.prow{grid-template-columns:1fr}.brand{font-size:24px}.brand img{height:40px}nav{margin-inline-start:0;width:100%}nav a{flex:1;text-align:center;padding:9px 6px}}
.dlg.wide{max-width:780px}
.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.lnk:hover{text-decoration-color:currentColor}
.nt{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
.nm{flex-wrap:wrap}
.nmw{display:flex;flex-direction:column}
.xb{min-height:34px;min-width:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:13px;padding:2px 8px}
.bon{font-size:13px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--ye);color:#2a2927;white-space:nowrap}
.alerts{border:2px solid var(--rd);border-radius:14px;padding:4px 14px;margin:10px 0}
.alerts summary{color:var(--rd)}
.al{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.al .mut{font-size:14px}
.sc{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:13px;background:var(--card);margin:2px}
.wk{padding:8px 0;border-bottom:1px solid var(--line)}
.wk b{display:block;margin-bottom:4px}
.cx{opacity:.55;text-decoration:line-through}
.hol{background:var(--card);border-radius:14px;padding:24px;text-align:center;margin-top:14px}
.hol b{font:30px/1.2 Lalezar,sans-serif;font-weight:400;display:block}
.pp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.pp label{font-size:13px;display:grid;gap:2px}
.chk{display:flex;gap:8px;align-items:center;min-height:40px;font-weight:500}
.chk input{width:20px;height:20px}
@media(max-width:640px){.pp{grid-template-columns:repeat(3,minmax(0,1fr))}}
.seg{grid-template-columns:repeat(6,minmax(0,1fr));width:min(540px,100%)}
.ctl{display:flex;flex-direction:column;gap:4px;align-items:stretch;width:min(540px,100%)}
.tas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.tas button{min-height:38px;border-radius:10px;border:1.5px dashed var(--line);background:var(--bg);font-weight:500;font-size:14px;cursor:pointer}
.tas button.on{background:var(--c);border:1.5px solid var(--c);color:#fff}
#sst{color:#fff;font-size:13px;opacity:.8;white-space:nowrap}#sst.on{color:#7ee0a0;opacity:1}
#inst{background:var(--ye);color:var(--dk);border:0;border-radius:10px;min-height:40px;padding:6px 12px;font-weight:700;cursor:pointer}
.up{color:#3F9B5B;font-weight:700}.dn{color:var(--rd);font-weight:700}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.cmp .kpi small{display:block;color:var(--mut);font-size:14px}
.tsel{display:flex;gap:8px;align-items:center;margin-bottom:8px}.tsel select{max-width:260px}
.srch{margin:12px 0 0}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.lg .mut{font-size:13px;white-space:nowrap}
.msg textarea{min-height:170px;font-size:15px}
.srow.s5{grid-template-columns:minmax(0,1fr) 150px auto auto auto}
.filters .acts{grid-column:1/-1}
.hb.ab{grid-template-columns:minmax(100px,180px) minmax(0,1fr) auto}.hb.ab span:last-child{white-space:nowrap;font-size:13px;font-weight:500}
.hp{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:6px}
[data-pt],[data-ppt],[data-al],#bnPts,#nPts,#pPhone,#syncIn{direction:ltr;text-align:right}
.srow.trow{grid-template-columns:minmax(0,1fr) auto auto}@media(max-width:640px){.srow.trow{grid-template-columns:1fr}}
.wdel{display:flex;justify-content:flex-start;margin:-2px 0 8px}
.tag{font-size:12px;background:var(--card);border-radius:999px;padding:1px 8px;color:var(--mut);font-weight:500}
@media(max-width:640px){.seg button{font-size:13px}.srow.s5{grid-template-columns:1fr 1fr 1fr}.srow.s5 input,.srow.s5 select{grid-column:span 3}.srow.s5 button{grid-column:auto}}
.ro .tas button{pointer-events:none;opacity:.7}
#undo{position:fixed;bottom:18px;inset-inline-start:18px;z-index:19;background:var(--dk);color:#fff;border:0;border-radius:12px;min-height:44px;padding:8px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.locked .seg button,.locked .tas button,.locked .edit{pointer-events:none;opacity:.55}
.locked .strip .edit{pointer-events:auto;opacity:1}
.lockn{border-color:var(--gr);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.calm b{display:block;margin-bottom:6px;font-size:17px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cdw{text-align:center;font-size:13px;color:var(--mut)}
.cd{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px;cursor:pointer;color:var(--ink)}
.cd small{font-size:11px;font-weight:500}
.cd.off{border:0;color:var(--mut);opacity:.5;font-weight:400;cursor:default}
.cd.l4{background:#2FBFCB;border-color:#2FBFCB;color:#fff}.cd.l3{background:#9fe0e6;border-color:#9fe0e6;color:#1d3d40}.cd.l2{background:#FCBE14;border-color:#FCBE14;color:#2a2927}.cd.l1{background:#E04F3F;border-color:#E04F3F;color:#fff}
.cd.hol{background:repeating-linear-gradient(45deg,var(--card),var(--card) 4px,var(--line) 4px,var(--line) 8px);color:var(--mut)}
.cd.nr{border-style:dashed}
.calk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}.calk .cd{display:inline-block;min-height:14px;width:14px;height:14px;padding:0;vertical-align:middle;cursor:default}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="logo.png" alt="شعار وتد">تحضير وتد</div>
  <button id="inst" hidden>تثبيت كتطبيق</button><span id="sst" hidden></span>
  <nav id="nav">
    <a href="#take" data-v="take">التحضير</a>
    <a href="#stats" data-v="stats">الإحصائيات</a>
    <a href="#students" data-v="students">الطلاب</a>
    <a href="#settings" data-v="settings">الإعدادات</a>
  </nav>
</header>
<main id="main"><div class="empty">جاري التحميل…</div></main>
<div id="toast" role="status"></div>
<button id="undo" hidden>تراجع</button>
<script>
{
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ST=[
 {k:'sh',l:'حاضر بشماغ',s:'بشماغ',hex:'#F6941F'},
 {k:'p',l:'حاضر',s:'حاضر',hex:'#2FBFCB'},
 {k:'l',l:'متأخر',s:'متأخر',hex:'#5B7FDB'},
 {k:'e',l:'معتذر',s:'معتذر',hex:'#FCBE14'},
 {k:'m',l:'محروم',s:'محروم',hex:'#8a8580'},
 {k:'a',l:'غائب',s:'غائب',hex:'#E04F3F'}];
const STM=Object.fromEntries(ST.map(s=>[s.k,s]));
const ATT=new Set(['sh','p','l']);
const TAS=[{k:'y',l:'سمّع',hex:'#3F9B5B'},{k:'n',l:'لم يسمّع',hex:'#B5523B'}];
const TASM={y:TAS[0],n:TAS[1]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,(b||1)-1,c||1)};
const sunday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x};
const addD=(d,k)=>{const x=new Date(d);x.setDate(x.getDate()+k);return x};
const today0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};

const sgn=p=>'\u2066'+(p>0?'+':'')+p+'\u2069';
const num=v=>'\u2066'+v+'\u2069';

const DEF={points:{sh:8,p:5,l:3,e:0,m:0,a:-5,ty:0,tn:0},alerts:{streak:3,pct:70,exc:4},
 terms:[{id:'t1',name:'الفصل الحالي',start:iso(sunday(new Date())),weeks:1}],cur:'t1',
 batches:[{id:'b6',name:'دفعة سادس'},{id:'b5',name:'دفعة خامس'},{id:'b4',name:'دفعة رابع'},{id:'b3',name:'دفعة ثالث'}],
 programs:[{id:'halaqa',name:'الحلقة',days:[0,1,2,3],tasmee:true},{id:'tue',name:'برنامج الثلاثاء',days:[2]},{id:'wkend',name:'برنامج نهاية الأسبوع',days:[4]}]};

let S={cfg:clone(DEF),students:[],all:{},bonus:[],log:[]};
let ui={view:'take',term:null,week:null,sess:null,stW:'all',stP:'all',stB:'all',prof:null,q:''};
let db=null,U=null,ME=null,local=false,readOnly=false,ready=false,stale=false,dl=null,deferRender=false;
const loaded={cfg:false,st:false,wk:false,bn:false};
const $=s=>document.querySelector(s);
const AD='٠١٢٣٤٥٦٧٨٩';
const ar=s=>String(s).replace(/[0-9]/g,d=>AD[d]).replace(/%/g,'٪');
const toL=s=>String(s??'').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[−–]/g,'-');
function arabize(root){if(root.nodeType===3){const n=root;if(/[0-9%]/.test(n.nodeValue)&&n.parentElement&&!n.parentElement.closest('script,style,textarea'))n.nodeValue=ar(n.nodeValue);return}
 if(root.nodeType!==1||root.closest&&root.closest('script,style'))return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/[0-9%]/.test(n.nodeValue)&&!n.parentElement.closest('script,style,textarea'))n.nodeValue=ar(n.nodeValue)}}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')arabize(m.target);else m.addedNodes.forEach(arabize)}}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
arabize(document.body);
const HF=(()=>{try{return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'})}catch(e){return null}})();
const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
function hj(d){if(!HF)return null;const p={};for(const x of HF.formatToParts(d))p[x.type]=x.value;return {d:+p.day,m:+p.month,y:parseInt(p.year,10)}}
const fmt=d=>{const h=hj(d);return h?h.d+'/'+h.m:d.getDate()+'/'+(d.getMonth()+1)};
const hfull=d=>{const h=hj(d);return h?h.d+'/'+h.m+'/'+h.y+'هـ':iso(d)};

function persist(path,get){if(readOnly)return;if(local||!db){stampPath(path);lsSave();syncSoon();return}
 const q=Q[path]||(Q[path]={busy:false,again:false,dirty:false,t:0});q.get=get;q.dirty=true;clearTimeout(q.t);q.t=setTimeout(()=>flush(path),450)}
async function flush(path){const q=Q[path];if(q.busy){q.again=true;return}q.busy=true;q.again=false;q.dirty=false;
 try{await db.doc(path).set(clone(q.get()))}catch(e){const c=e&&e.code;
  if(c==='invalid_argument'){readOnly=true;toast('لا تملك صلاحية التعديل على هذه الصفحة');render()}
  else if(c==='quota_exceeded')toast('امتلأت مساحة الحفظ');
  else if(c==='unavailable'){q.dirty=true;q.again=true}
  else toast('تعذّر الحفظ، حاول مرة أخرى')}
 q.busy=false;if(q.again)setTimeout(()=>flush(path),q.dirty?800:0)}

const tasPts=v=>v==='y'?(+P().ty||0):v==='n'?(+P().tn||0):0;

const wid=(n,tid=TERM().id)=>tid==='t1'?'w'+n:tid+'-w'+n;
const WK=n=>S.all[wid(n)];
function weekByDate(t=TERM()){return Math.max(1,Math.floor((sunday(new Date())-parse(t.start))/864e5/7)+1)}
function dayDate(n,d){return addD(parse(TERM().start),7*(n-1)+d)}
function week(n){const id=wid(n);const w=S.all[id]||(S.all[id]={});['rec','sched','notes','cancel','tas'].forEach(k=>w[k]=w[k]||{});w.term=TERM().id;return w}

 return o.sort((a,b)=>a.day-b.day||a.pi-b.pi)}
const active=n=>isHol(n)?[]:sessions(n).filter(s=>!s.cx);
const recOf=(n,key)=>(WK(n)&&WK(n).rec&&WK(n).rec[key])||{};
const tasOf=(n,key)=>(WK(n)&&WK(n).tas&&WK(n).tas[key])||{};
const noteOf=(n,key,sid)=>((WK(n)&&WK(n).notes&&WK(n).notes[key])||{})[sid]||'';

function weekComplete(n){if(isHol(n))return true;const all=sessions(n);return AS().length>0&&all.length>0&&active(n).every(s=>done(n,s.key)>=AS().length)}

 const lost=list.filter(s=>!S.cfg.batches.some(b=>b.id===s.b));if(lost.length)g.push({b:{id:'',name:'بدون دفعة'},items:lost});return g}

  const att=t.filter(x=>ATT.has(x.k)).length,pct=t.length?att/t.length*100:null;const exc=t.filter(x=>x.k==='e'&&x.date>=from).length;const r=[];

function calc(f=ui){const per={};S.students.forEach(s=>per[s.id]={sh:0,p:0,l:0,e:0,m:0,a:0,n:0,ty:0,tn:0,ap:0,tp:0,bp:0,pts:0});
 let sessCount=0;const weekPct=[];const W=f.stW,Pf=f.stP,B=f.stB;
 for(let n=1;n<=NW();n++){if(W!=='all'&&+W!==n)continue;let wa=0,wn=0;
  if(isHol(n)){weekPct.push({n,v:null,hol:true});continue}
  active(n).forEach(s=>{if(Pf!=='all'&&s.pid!==Pf)return;const r=recOf(n,s.key),tz=tasOf(n,s.key);let any=false;
   for(const sid in r){const o=per[sid],k=r[sid];if(!o||o[k]===undefined)continue;
    if(B!=='all'&&(stu(sid)||{}).b!==B)continue;
    o[k]++;o.n++;o.ap+=ptsOf(k,s.pid);any=true;wn++;if(ATT.has(k))wa++;
    if(s.tasmee&&ATT.has(k)&&tz[sid]){o['t'+tz[sid]]++;o.tp+=tasPts(tz[sid])}}
   if(any)sessCount++});
  weekPct.push({n,v:wn?wa/wn:null})}
 if(Pf==='all')S.bonus.forEach(b=>{const o=per[b.sid];if(!o||(b.term||'t1')!==TERM().id)return;if(W!=='all'&&+W!==b.week)return;o.bp+=+b.pts||0});

 rows.sort((a,b)=>b.pts-a.pts||(b.pct||0)-(a.pct||0)||a.s.name.localeCompare(b.s.name,'ar'));
 return {rows,sessCount,weekPct}}
const pctT=v=>v==null?'—':Math.round(v*100)+'%';
function periodAgg(from,to){let n=0,att=0,a=0;
 for(let w=1;w<=NW();w++)active(w).forEach(s=>{const d=dayDate(w,s.day);if(d<from||d>=to)return;if(ui.stP!=='all'&&s.pid!==ui.stP)return;const r=recOf(w,s.key);
  for(const sid in r){const st=stu(sid);if(!st||(ui.stB!=='all'&&st.b!==ui.stB))continue;n++;if(ATT.has(r[sid]))att++;if(r[sid]==='a')a++}});
 return {n,pct:n?att/n:null,a}}
function cmpCard(title,cur,prev,labA,labB){let d='';if(cur.pct!=null&&prev.pct!=null){const x=Math.round((cur.pct-prev.pct)*100);d=x>0?`<span class="up">▲ ${x}٪</span>`:x<0?`<span class="dn">▼ ${-x}٪</span>`:'<span class="mut">بدون تغيير</span>'}

 if(ch){UNDO=[];lsSave();if(!ready){ready=true}render()}if(push)syncSoon()}
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function zip(u,de){const CS=de?window.DecompressionStream:window.CompressionStream;if(!CS)throw 0;return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CS('gzip'))).arrayBuffer())}
async function seal(o){let u=new TextEncoder().encode(JSON.stringify(o)),z=0;try{u=await zip(u);z=1}catch(e){}
 const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},SYNC.key,u));return JSON.stringify({v:1,z,iv:b64(iv),d:b64(ct)})}
async function unseal(txt){const o=JSON.parse(txt);let u=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},SYNC.key,ub64(o.d)));if(o.z)u=await zip(u,true);return JSON.parse(new TextDecoder().decode(u))}
async function prepKey(code){const e=new TextEncoder();const base=await crypto.subtle.importKey('raw',e.encode(code),'PBKDF2',false,['deriveKey']);
 SYNC.key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode('watad-tahdeer-v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 const h=new Uint8Array(await crypto.subtle.digest('SHA-256',e.encode('topic:'+code)));SYNC.topic='watad-tahdeer/v1/'+[...h.slice(0,16)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function mqtt(url){const enc=new TextEncoder(),dec=new TextDecoder();const C={alive:false,ws:null,back:1500,ping:0,stop:false};
 const vlen=n=>{const b=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;b.push(d)}while(n>0);return b};
 const str=s=>{const u=enc.encode(s);return [u.length>>8,u.length&255].concat(Array.from(u))};
 const pkt=(h,body)=>{const v=vlen(body.length),o=new Uint8Array(1+v.length+body.length);o[0]=h;o.set(v,1);o.set(body,1+v.length);return o};
 function connect(){if(C.stop)return;try{C.ws=new WebSocket(url,'mqtt')}catch(e){return retry()}C.ws.binaryType='arraybuffer';let buf=new Uint8Array(0);
  C.ws.onopen=()=>C.ws.send(pkt(0x10,str('MQTT').concat([4,2,0,60],str('wt'+Math.random().toString(36).slice(2,12)))));
  C.ws.onmessage=ev=>{const d=new Uint8Array(ev.data),n=new Uint8Array(buf.length+d.length);n.set(buf);n.set(d,buf.length);buf=n;
   while(buf.length>=2){let mul=1,len=0,i=1,c;do{if(i>=buf.length)return;c=buf[i++];len+=(c&127)*mul;mul*=128}while(c&128);if(buf.length<i+len)return;const p=buf.slice(i,i+len),t=buf[0];buf=buf.slice(i+len);onPkt(t,p)}};
  C.ws.onclose=()=>{C.alive=false;clearInterval(C.ping);syncStatus();retry()};C.ws.onerror=()=>{try{C.ws.close()}catch(e){}}}
 function retry(){if(C.stop)return;setTimeout(connect,C.back);C.back=Math.min(C.back*1.7,20000)}
 function onPkt(t,p){const type=t>>4;
  if(type===2){if(p[1]!==0){try{C.ws.close()}catch(e){}return}C.alive=true;C.back=1500;C.ws.send(pkt(0x82,[0,1].concat(str(SYNC.topic),[0])));
   C.ping=setInterval(()=>{if(C.alive)C.ws.send(new Uint8Array([0xC0,0]))},25000);syncStatus();
   setTimeout(()=>{if(SYNC.got&&C.alive)C.pub(SYNC.last)},4000)}
  else if(type===3){const tl=(p[0]<<8)|p[1],topic=dec.decode(p.slice(2,2+tl));let off=2+tl;if((t>>1)&3)off+=2;if(topic!==SYNC.topic)return;const txt=dec.decode(p.slice(off));if(!txt)return;
   unseal(txt).then(mergeRemote).catch(()=>{})}}
 C.pub=txt=>{if(!C.alive||!txt)return;try{C.ws.send(pkt(0x31,str(SYNC.topic).concat(Array.from(enc.encode(txt)))))}catch(e){}};
 C.close=()=>{C.stop=true;C.alive=false;clearInterval(C.ping);try{C.ws.close()}catch(e){}};
 connect();return C}
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
function syncStatus(){const n=SYNC.conns.filter(c=>c.alive).length;SYNC.status=!SYNC.code?'off':n?'on':'wait';const el=$('#sst');if(el){el.hidden=!SYNC.code;el.textContent=n?'● متزامن':'○ يتصل…';el.className=n?'on':''}}
let syncT=0;
function syncSoon(){if(!SYNC.code||!SYNC.key)return;clearTimeout(syncT);syncT=setTimeout(async()=>{
 const o={v:1,ts:S._ts||{},cfg:S.cfg,st:S.students,bn:S.bonus,all:S.all,log:(S.log||[]).slice(-1500)};
 try{SYNC.last=await seal(o);if(SYNC.got)SYNC.conns.forEach(c=>c.pub(SYNC.last))}catch(e){}},1500)}
async function startSync(code,creator){stopSync();if(!window.crypto||!crypto.subtle){toast('المتصفح لا يدعم المزامنة المشفّرة');return}
 SYNC.code=code;try{localStorage.setItem(SK,code)}catch(e){}SYNC.got=creator||localStorage.getItem(SG)==='1';if(creator){try{localStorage.setItem(SG,'1')}catch(e){}stampAll();lsSave()}
 await prepKey(code);SYNC.conns=BROKERS.map(mqtt);syncStatus();syncSoon()}
function stopSync(){SYNC.conns.forEach(c=>c.close());SYNC.conns=[];SYNC.code=null;SYNC.key=null;syncStatus()}
function newCode(){const A='0123456789',r=crypto.getRandomValues(new Uint8Array(12));let s='';r.forEach((b,i)=>{s+=A[b%A.length];if(i===3||i===7)s+='-'});return s}
function vSync(){const d=readOnly?' disabled':'';
 let h=`<h2>المزامنة بين الأجهزة</h2><p style="margin:0 0 8px">البيانات محفوظة في هذا الجهاز دائماً. فعّل المزامنة إذا تبي نفس البيانات على جوالك وكمبيوترك، أو مع شخص يحضّر معك. البيانات تُشفَّر قبل إرسالها، ولا يقرأها إلا من عنده الرمز.</p>`;
 if(SYNC.code)h+=`<div class="panel" style="margin-top:6px"><div class="mut">رمز المزامنة لهذا الجهاز</div><b style="font-size:26px;letter-spacing:2px;direction:ltr;display:block;text-align:right">${esc(SYNC.code)}</b>
  <div class="acts" style="margin-top:8px"><button class="btn" data-act="copysync">نسخ رابط الربط</button><button class="btn dg s" data-act="stopsync">إيقاف المزامنة هنا</button></div>
  <p class="mut">افتح الرابط المنسوخ في الجهاز الثاني، أو أدخل الرمز في إعداداته. احفظ الرمز عندك، ولا تعطيه إلا لمن يحضّر معك.</p></div>`;
 else h+=`<div class="acts"><button class="btn" data-act="mksync"${d}>إنشاء رمز مزامنة (من الجهاز اللي فيه بياناتك)</button></div>
  <div class="form" style="grid-template-columns:minmax(0,1fr) auto;margin-top:8px"><input type="text" id="syncIn" placeholder="عندك رمز؟ اكتبه هنا (١٢ رقماً)" autocomplete="off" style="direction:ltr"><button class="btn g" data-act="joinsync">ربط</button></div>
  <p class="mut">عند الربط برمز موجود، تُستبدل بيانات هذا الجهاز ببيانات الرمز.</p>`;
 h+=`<label style="display:grid;gap:4px;margin-top:12px;font-weight:500">اسمك (يظهر في سجل التعديلات)<input type="text" id="meName" value="${esc(ME||'')}" placeholder="مثلاً: أبو سعود"></label>`;
 return h}
async function saSettingsClick(D){
 if(D.act==='mksync'){if(!await ask('سيتم إنشاء رمز مزامنة ورفع بيانات هذا الجهاز (مشفّرة). استخدمه من الجهاز اللي فيه بياناتك الصحيحة.','إنشاء'))return true;await startSync(newCode(),true);render();return true}
 if(D.act==='joinsync'){const v=toL($('#syncIn').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length!==12){toast('الرمز ١٢ رقماً');return true}
  const code=v.slice(0,4)+'-'+v.slice(4,8)+'-'+v.slice(8);try{localStorage.removeItem(SG)}catch(e){}S._ts={};await startSync(code,false);toast('جاري جلب البيانات…');render();return true}
 if(D.act==='stopsync'){if(await ask('إيقاف المزامنة على هذا الجهاز؟ البيانات تبقى فيه.','إيقاف')){stopSync();try{localStorage.removeItem(SK);localStorage.removeItem(SG)}catch(e){}render()}return true}
 if(D.act==='copysync'){const u=location.href.split('#')[0]+'#sync-'+SYNC.code.replace(/-/g,'');try{await navigator.clipboard.writeText(u);toast('نُسخ الرابط')}catch(e){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg"><p style="margin:0 0 8px">انسخ الرابط:</p><input type="text" readonly style="direction:ltr"><div class="acts" style="margin-top:10px"><button class="btn g" data-x="close">إغلاق</button></div></div>';o.querySelector('input').value=u;o.addEventListener('click',ev=>{if(ev.target===o||ev.target.dataset.x)o.remove()});document.body.appendChild(o);o.querySelector('input').select()}return true}
 return false}
function saInit(){ME=(()=>{try{return localStorage.getItem(SN)||''}catch(e){return ''}})();
 let had=false;try{had=!!localStorage.getItem(LS)}catch(e){}
 if(had)lsLoad();else{S.cfg=norm(clone(SEED_CFG));S.students=SEED.slice();S.all=clone(SEED_ALL);S._ts={};lsSave();try{localStorage.setItem('watad-seedv','3')}catch(e){}}
 S.cfg=norm(S.cfg);S.bonus=S.bonus||[];S.all=S.all||{};S.log=S.log||[];initPrev();
 let sv=0;try{sv=+localStorage.getItem('watad-seedv')||0}catch(e){}
 if(had&&sv<3){const now=Date.now();S.cfg=norm(clone(SEED_CFG));S.students=SEED.slice();S.all=clone(SEED_ALL);S.bonus=[];S.log=[];
  S._ts=S._ts||{};Object.keys(S._ts).forEach(k=>S._ts[k]=now);initPrev();stampAll();lsSave();try{localStorage.setItem('watad-seedv','3')}catch(e){}}
 let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}h=toL(h).toUpperCase();const hm=/^SYNC[-_]?(.+)$/.exec(h);const hv=hm?hm[1].replace(/[^A-Z0-9]/g,''):'';if(hv.length===12){const v=hv,code=v.slice(0,4)+'-'+v.slice(4,8)+'-'+v.slice(8);
  setTimeout(async()=>{if(SYNC.code===code){location.hash='take';return}if(await ask('ربط هذا الجهاز برمز المزامنة '+code+'؟ تُستبدل بيانات هذا الجهاز ببيانات الرمز.','ربط')){try{localStorage.removeItem(SG)}catch(e){}S._ts={};await startSync(code,false);toast('جاري جلب البيانات…')}location.hash='take'},300)}
 let c=null;try{c=localStorage.getItem(SK)}catch(e){}if(c)startSync(c,false);
 try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
 let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=$('#inst');b.hidden=false;b.onclick=async()=>{b.hidden=true;try{await dp.prompt()}catch(x){}dp=null}});
 main.addEventListener('change',e=>{if(e.target.id==='meName'){ME=e.target.value.trim();try{localStorage.setItem(SN,ME)}catch(x){}toast('تم')}})}

function afterLoad(){if(ready)return;if(loaded.cfg&&loaded.st&&loaded.wk&&loaded.bn){ready=true;autoWeeks();render()}}
route();
(async()=>{const C=window.claude;const safe=p=>p.catch(()=>null);
 [dl,db,U]=C?await Promise.all([safe(C.use('downloads')),safe(C.use('db')),safe(C.use('user'))]):[null,null,null];
 if(C)setupDesktop(C);

 try{if(U){ME=await U.id();const w=await U.can('data.write');if(w===false)readOnly=true}}catch(e){}
 const timer=setTimeout(()=>{if(!ready){stale=true;render()}},10000);
 const err=()=>{clearTimeout(timer);stale=true;render()};
 const rer=()=>{if(ready){clearTimeout(timer);stale=false}render()};
 db.doc('app/config').onSnapshot(s=>{if(!pending('app/config'))S.cfg=norm(s.exists?s.data():null);if(!s.metadata.fromCache){loaded.cfg=true;afterLoad()}rer()},err);
 db.doc('app/students').onSnapshot(s=>{if(!pending('app/students')&&s.exists)S.students=clone(s.data().list||[]);if(!s.metadata.fromCache){loaded.st=true;afterLoad()}rer()},err);
 db.doc('app/bonus').onSnapshot(s=>{if(!pending('app/bonus')&&s.exists)S.bonus=clone(s.data().list||[]);if(!s.metadata.fromCache){loaded.bn=true;afterLoad()}rer()},err);
 db.collection('weeks').onSnapshot(q=>{q.docChanges().forEach(ch=>{const id=ch.doc.id;if(pending('weeks/'+id))return;
   if(ch.type==='removed')delete S.all[id];else S.all[id]=clone(ch.doc.data())});

 db.collection('log').orderBy('d','desc').limit(14).onSnapshot(q=>{q.docs.forEach(d=>{const it=(d.data().items)||[];LG[d.id]=clone(it);const ids=new Set(it.map(x=>x.id));
   if(LOCALLOG[d.id]&&!pending('log/'+d.id))LOCALLOG[d.id]=LOCALLOG[d.id].filter(x=>!ids.has(x.id))});if(ui.view==='settings'&&ready)render()},()=>{});
})();
